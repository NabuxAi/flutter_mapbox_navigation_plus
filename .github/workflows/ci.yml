name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  analyze:
    name: Dart analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      # Fail on warnings/errors only. The package carries pre-existing info-level
      # lints (very_good_analysis); treating those as fatal would block CI on
      # unrelated noise.
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  android-build:
    name: Android (Navigation SDK v3) build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Configure Mapbox downloads token
        env:
          MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
        run: |
          if [ -z "$MAPBOX_DOWNLOADS_TOKEN" ]; then
            echo "::error::MAPBOX_DOWNLOADS_TOKEN secret is not set. Add a Mapbox token with the downloads:read scope under Settings → Secrets and variables → Actions."
            exit 1
          fi
          mkdir -p ~/.gradle
          echo "MAPBOX_DOWNLOADS_TOKEN=$MAPBOX_DOWNLOADS_TOKEN" >> ~/.gradle/gradle.properties
      - name: Build example debug APK (compiles the v3 Kotlin sources)
        working-directory: example
        run: flutter build apk --debug

  ios-build:
    name: iOS (Navigation SDK v3) build
    # macos-15 provides Xcode 16.4, the toolchain the pinned Mapbox SDK
    # (Maps 11.24.2) is built and validated against.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 16.4 (matches the pinned Mapbox SDK)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Configure Mapbox downloads credentials
        env:
          MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
        run: |
          if [ -z "$MAPBOX_DOWNLOADS_TOKEN" ]; then
            echo "::error::MAPBOX_DOWNLOADS_TOKEN secret is not set. Add a Mapbox token with the downloads:read scope under Settings → Secrets and variables → Actions."
            exit 1
          fi
          # Swift Package Manager downloads the Mapbox v3 binaries from
          # api.mapbox.com, which is authenticated through ~/.netrc.
          printf 'machine api.mapbox.com\n  login mapbox\n  password %s\n' "$MAPBOX_DOWNLOADS_TOKEN" > "$HOME/.netrc"
          chmod 600 "$HOME/.netrc"
      - name: Enable Flutter Swift Package Manager
        run: flutter config --enable-swift-package-manager
      - name: Build example (compiles the v3 Swift sources via SPM)
        working-directory: example
        run: flutter build ios --debug --no-codesign
