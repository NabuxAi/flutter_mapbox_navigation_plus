name: Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-release-apk:
    name: Build example release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Configure Mapbox downloads token (build-time)
        env:
          MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
        run: |
          if [ -z "$MAPBOX_DOWNLOADS_TOKEN" ]; then
            echo "::error::MAPBOX_DOWNLOADS_TOKEN secret is not set (needs the downloads:read scope)."
            exit 1
          fi
          mkdir -p ~/.gradle
          echo "MAPBOX_DOWNLOADS_TOKEN=$MAPBOX_DOWNLOADS_TOKEN" >> ~/.gradle/gradle.properties
      - name: Inject Mapbox runtime access token (pk) for the map to render
        env:
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
        run: |
          if [ -z "$MAPBOX_ACCESS_TOKEN" ]; then
            echo "::warning::MAPBOX_ACCESS_TOKEN (public pk token) secret is not set; the map will not render in the built APK."
          else
            dir=example/android/app/src/main/res/values
            mkdir -p "$dir"
            printf '%s' '<?xml version="1.0" encoding="utf-8"?><resources xmlns:tools="http://schemas.android.com/tools"><string name="mapbox_access_token" translatable="false" tools:ignore="UnusedResources">'"$MAPBOX_ACCESS_TOKEN"'</string></resources>' > "$dir/mapbox_access_token.xml"
            echo "Wrote runtime token to $dir/mapbox_access_token.xml"
          fi
      - name: Build release APK
        working-directory: example
        run: flutter build apk --release
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: example/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: example/build/app/outputs/flutter-apk/app-release.apk
