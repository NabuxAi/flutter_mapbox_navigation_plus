// Declarative plugin application (no buildscript KGP classpath): Flutter is
// dropping support for plugins that imperatively apply the Kotlin Gradle
// Plugin, and this lets the consuming app's AGP/Kotlin versions apply.
plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

group 'com.eopeter.fluttermapboxnavigation'
version '1.0-SNAPSHOT'

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://plugins.gradle.org/m2' }
        maven {
            url 'https://api.mapbox.com/downloads/v2/releases/maven'
            authentication {
                basic(BasicAuthentication)
            }
            credentials {
                username = "mapbox"
                password = project.hasProperty('MAPBOX_DOWNLOADS_TOKEN') ? project.property('MAPBOX_DOWNLOADS_TOKEN') : System.getenv('MAPBOX_DOWNLOADS_TOKEN')
                if (password == null || password == "") {
                    throw new GradleException("MAPBOX_DOWNLOADS_TOKEN isn't set. Set it to the project properties or to the enviroment variables.")
                }
            }
        }
    }
}

// Pin a stable (non release-candidate) Navigation SDK release.
def mapboxNavigationV3Version = '3.20.0'
def mapboxMapsV11Version = '11.16.3'

android {
    namespace 'com.eopeter.fluttermapboxnavigation'
    compileSdkVersion 35

    sourceSets {
        // Mapbox Navigation SDK v3 is the only built variant. The legacy v2
        // sources under src/main are kept in the repo for reference but are
        // not compiled.
        main {
            java.srcDirs = ['src/v3/kotlin']
            res.setSrcDirs(['src/v3/res'])
            manifest.srcFile 'src/v3/AndroidManifest.xml'
        }
    }
    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 33
        multiDexEnabled true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // Ship ProGuard/R8 keep + dontwarn rules to consuming apps that minify.
        consumerProguardFiles 'consumer-rules.pro'
    }

    lintOptions {
        disable 'InvalidPackage'
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures{
        viewBinding = true
    }
}

kotlin {
    sourceSets {
        main {
            kotlin.srcDirs = ['src/v3/kotlin']
        }
    }
}

dependencies {
    // ── Mapbox Navigation SDK v3 (only built variant) ──
    implementation "com.mapbox.navigationcore:android:$mapboxNavigationV3Version"
    implementation "com.mapbox.navigationcore:ui-maps:$mapboxNavigationV3Version"
    implementation "com.mapbox.navigationcore:voice:$mapboxNavigationV3Version"
    implementation "com.mapbox.navigationcore:tripdata:$mapboxNavigationV3Version"
    implementation "com.mapbox.navigationcore:ui-components:$mapboxNavigationV3Version"
    implementation "com.mapbox.navigationcore:navigation:$mapboxNavigationV3Version"
    implementation "com.mapbox.maps:android:$mapboxMapsV11Version"
    // ViewTree owner extensions used to drive the bare MapView lifecycle inside
    // the Flutter PlatformView (otherwise the v11 renderer never starts -> black map).
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.7"
    implementation "androidx.savedstate:savedstate-ktx:1.2.1"

    // The Kotlin stdlib is added automatically by the Kotlin Gradle Plugin.
    implementation 'com.jakewharton.timber:timber:4.7.1'
    implementation 'com.google.code.gson:gson:2.8.9'

    implementation "androidx.core:core-ktx:1.9.0"
    implementation "com.google.android.material:material:1.8.0"
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "androidx.cardview:cardview:1.0.0"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
    implementation "com.google.android.gms:play-services-location:21.0.1"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.4"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.6.4"
    implementation 'androidx.annotation:annotation:1.6.0'
    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
}
