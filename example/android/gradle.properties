org.gradle.jvmargs=-Xmx4096m
android.useAndroidX=true
# Jetifier is unnecessary (everything is AndroidX) and its transform was
# running out of heap on CI. Disabling it avoids the OOM and speeds up builds.
android.enableJetifier=false
kotlin.code.style=official
# NEVER commit a real token here. Supply your secret downloads token via
# ~/.gradle/gradle.properties or the MAPBOX_DOWNLOADS_TOKEN env variable.
# MAPBOX_DOWNLOADS_TOKEN=sk.your-token-here